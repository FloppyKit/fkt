<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#001100">
  <title>FKT · Floppy Kit · gitfkt.dev</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/pwa/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/pwa/favicon-16.png">
  <link rel="icon" type="image/png" href="/pwa/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png">
  <style>
    :root {
      --bg: #000;
      --panel: #001408;
      --border: #0c5;
      --fg: #b8ffcc;
      --hi: #3dff7a;
      --mid: #6ee89a;
      --dim: #3a7a52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: "Courier New", Courier, ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      width: min(100%, 26rem);
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 1.35rem 1.2rem 1.25rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      letter-spacing: 0.14em;
      color: var(--hi);
    }
    p { margin: 0.45rem 0; font-size: 0.85rem; color: var(--mid); line-height: 1.45; }
    .actions { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 1.1rem; }
    a.btn {
      display: block;
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--hi);
      background: #000;
      padding: 0.75rem 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 0.82rem;
    }
    a.btn.primary { background: #0a2818; }
    a.btn:hover { border-color: var(--hi); }
    .foot {
      margin-top: 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: var(--dim);
    }
    .foot a { color: var(--mid); }
  </style>
</head>
<body>
  <div class="card">
    <h1>FKT · ICED COLD</h1>
    <p>Offline PSBT signer PWA. Open in the browser (works on phone — no download required).</p>
    <div class="actions">
      <a class="btn primary" href="/pwa/">OPEN SIGNER</a>
      <a class="btn" href="https://github.com/FloppyKit/fkt">GITHUB REPO</a>
    </div>
    <p class="foot"><a href="https://gitfkt.dev">gitfkt.dev</a></p>
  </div>
</body>
</html>
